appId: io.github.zhanghuan0517.quietpane
productName: QuietPane
copyright: Copyright © 2026 zhanghuan0517 and Goof Off contributors
afterPack: build/afterPack.cjs
directories:
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
  - LICENSE
  - '!**/.DS_Store'
  - '!src/**'
  - '!logs/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.idea,.vscode}/**'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asarUnpack:
  - resources/**
win:
  executableName: quiet-pane
  artifactName: QuietPane-${version}-Portable.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  artifactName: QuietPane-${version}-Setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.png
  artifactName: QuietPane-${version}-mac.${ext}
  category: public.app-category.utilities
  identity: '-'
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: QuietPane-${version}-mac.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
